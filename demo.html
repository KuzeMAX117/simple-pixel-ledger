/* ============ 主题变量 ============ */
.pl-view,
.pl-block,
.pl-modal {
  --pl-red: #e03131;
  --pl-red-dim: rgba(224, 49, 49, 0.12);
  --pl-green: #2f9e44;
  --pl-green-dim: rgba(47, 158, 68, 0.12);
  --pl-border: var(--background-modifier-border);
  --pl-bg: var(--background-primary);
  --pl-bg2: var(--background-secondary);
  --pl-text: var(--text-normal);
  --pl-muted: var(--text-muted);
  --pl-accent: #f59f00;
}
body.theme-dark .pl-view,
body.theme-dark .pl-block,
body.theme-dark .pl-modal {
  --pl-red: #ff8787;
  --pl-green: #69db7c;
}

/* ============ 像素数字字体 ============ */
.pl-num {
  font-family: "Press Start 2P", "Courier New", monospace;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1.4;
}

/* ============ 通用布局 ============ */
.pl-view,
.pl-block,
.pl-modal {
  box-sizing: border-box;
  color: var(--pl-text);
}
.pl-view *,
.pl-block *,
.pl-modal * {
  box-sizing: border-box;
}
.pl-title {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.pl-empty {
  color: var(--pl-muted);
  font-size: 13px;
  padding: 10px 4px;
}

/* ============ 头部 ============ */
.pl-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.pl-header-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
}
.pl-title-icon {
  color: var(--pl-accent);
  font-weight: 700;
}
.pl-header-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}
.pl-nav-btn,
.pl-nav-today {
  border: 2px solid var(--pl-border);
  border-radius: 0;
  background: var(--pl-bg2);
  color: var(--pl-text);
  cursor: pointer;
  padding: 3px 10px;
  box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.18);
  font-size: 12px;
  line-height: 1.4;
  min-height: 28px;
}
.pl-nav-btn:hover,
.pl-nav-today:hover {

<body>
<div class="demo-banner"><b>演示界面</b> · 示例数据（非真实账单）· 与插件实际界面一致：红=支出/负收入，绿=收入/正收入，数字为像素风字体；收支明细按「支出/收入」分组折叠，点击标题展开/收起；点条目「×」删除前会二次确认</div>
<div class="pl-view" id="app"></div>
<script>
(function(){
  // —— 示例数据（仅用于演示）——
  var ENTRIES = [
    {date:"2026-10-01",type:"expense",category:"餐饮",detail:"奶茶",amount:15},
    {date:"2026-10-02",type:"expense",category:"交通",detail:"地铁",amount:4},
    {date:"2026-10-02",type:"expense",category:"餐饮",detail:"午餐",amount:22},
    {date:"2026-10-03",type:"income",category:"红包",detail:"国庆红包",amount:100},
    {date:"2026-10-05",type:"expense",category:"购物",detail:"网购",amount:128},
    {date:"2026-10-08",type:"income",category:"工资",detail:"10月工资",amount:3500},
    {date:"2026-10-08",type:"expense",category:"居住",detail:"房租",amount:1200},
    {date:"2026-10-12",type:"income",category:"兼职",detail:"周末兼职",amount:500},
    {date:"2026-10-15",type:"expense",category:"餐饮",detail:"晚餐",amount:45},
    {date:"2026-10-15",type:"expense",category:"交通",detail:"打车",amount:12},
    {date:"2026-10-20",type:"expense",category:"医疗",detail:"挂号买药",amount:88},
    {date:"2026-10-25",type:"income",category:"理财",detail:"基金收益",amount:30},
    {date:"2026-10-28",type:"expense",category:"购物",detail:"网购",amount:126},
    {date:"2026-10-29",type:"expense",category:"餐饮",detail:"早餐",amount:8},
    {date:"2026-10-29",type:"expense",category:"餐饮",detail:"午餐",amount:26},
    {date:"2026-10-29",type:"expense",category:"交通",detail:"地铁",amount:4}
  ];
  var PRESETS = {
    amounts:["5","10","20","50","100","200","500","1000"],
    expenseCategories:["餐饮","交通","购物","娱乐","居住","学习","医疗","人情","其他"],
    incomeCategories:["工资","兼职","理财","红包","报销","生活费","其他"],
    details:["早餐","午餐","晚餐","奶茶","地铁","打车","网购","房租","水电","话费","游戏","电影"]
  };
  var Y=2026, M=9; // 2026-10
  var selected = "2026-10-29";
  var dayExpand={expense:false,income:false}; // 分组折叠状态（同一天内删除后保持）
  function pad(n){return n<10?"0"+n:String(n);}
  function totals(es){var i=0,e=0;es.forEach(function(x){if(x.type==="income")i+=x.amount;else e+=x.amount;});return {income:i,expense:e,net:i-e};}
  function fmt(n){var neg=n<0;var s=Math.abs(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});return (neg?"-":"")+"¥"+s;}
  function moneyClass(n){return n>0?"pl-pos":(n<0?"pl-neg":"pl-zero");}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var app=document.getElementById("app");

  function render(){
    var prefix=Y+"-"+pad(M+1);
    var monthEntries=ENTRIES.filter(function(e){return e.date.indexOf(prefix)===0;});
    var mt=totals(monthEntries);
    var byDate={};
    monthEntries.forEach(function(e){ (byDate[e.date]=byDate[e.date]||[]).push(e); });
    var daysInMonth=new Date(Y,M+1,0).getDate();
    var offset=(new Date(Y,M,1).getDay()+6)%7;
    var today="2026-10-29";
    var html="";
    html+='<div class="pl-header"><div class="pl-header-title"><span class="pl-title-icon">¥</span><span class="pl-num">'+Y+'.'+pad(M+1)+'</span></div>';
    html+='<div class="pl-header-nav"><button class="pl-nav-btn" data-nav="prev">‹</button><button class="pl-nav-today" data-nav="today">今天</button><button class="pl-nav-btn" data-nav="next">›</button></div></div>';
    html+='<div class="pl-strip">'+stat("支出",-mt.expense,"pl-neg")+stat("收入",mt.income,"pl-pos")+stat("结余",mt.net,moneyClass(mt.net))+'</div>';
    html+='<div class="pl-cal-wrap"><div class="pl-cal">';
    ["一","二","三","四","五","六","日"].forEach(function(w){html+='<div class="pl-wd'+(w==="六"||w==="日"?" pl-wd-weekend":"")+'">'+w+'</div>';});
    for(var i=0;i<offset;i++)html+='<div class="pl-day pl-day-empty"></div>';
    for(var d=1;d<=daysInMonth;d++){
      var ds=prefix+"-"+pad(d);
      var es=byDate[ds]||[];
      var t=totals(es);
      var cls="pl-day";
      if(ds===today)cls+=" is-today";
      if(ds===selected)cls+=" is-selected";
      if(t.net>0)cls+=" has-pos";else if(t.net<0)cls+=" has-neg";
      html+='<div class="'+cls+'" data-date="'+ds+'"><div class="pl-day-num pl-num">'+d+'</div>';
      if(es.length){html+='<div class="pl-day-net pl-num '+moneyClass(t.net)+'">'+(t.net>0?"+":"")+Math.round(t.net*100)/100+'</div>';
        html+='<div class="pl-day-sub '+moneyClass(t.net)+'">'+(t.net>0?"收":(t.net<0?"支":"平"))+'</div>';}
      html+='</div>';
    }
    var rem=(offset+daysInMonth)%7;
    for(i=0;rem&&i<7-rem;i++)html+='<div class="pl-day pl-day-empty"></div>';
    html+='</div></div>';

    // 日明细
    var pd=selected.split("-");var pdDate=new Date(+pd[0],+pd[1]-1,+pd[2]);
    var dayEntries=ENTRIES.filter(function(e){return e.date===selected;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var dt=totals(dayEntries);
    html+='<div class="pl-detail-wrap"><div class="pl-detail-title"><span>'+(pdDate.getMonth()+1)+'月'+pdDate.getDate()+'日 收支明细</span>'+(selected===today?'<span class="pl-badge">今天</span>':'')+'</div>';
    html+='<div class="pl-detail-total"><span class="pl-num '+moneyClass(dt.net)+'">'+fmt(dt.net)+'</span><span class="pl-detail-total-label">  支出'+fmt(-dt.expense)+' / 收入'+fmt(dt.income)+'</span></div>';
    // 分组折叠明细：默认只显示「支出/收入」两组标题，点击展开/折叠
    html+='<div class="pl-groups">';
    if(!dayEntries.length){
      html+='<div class="pl-empty">还没有记录，先记一笔吧～</div>';
    } else {
      var groups=[["支出","expense","pl-neg"],["收入","income","pl-pos"]];
      for(var gi=0;gi<groups.length;gi++){
        var gLabel=groups[gi][0],gKey=groups[gi][1],gCls=groups[gi][2];
        var gItems=dayEntries.filter(function(e){return e.type===(gKey==="expense"?"expense":"income");});
        if(!gItems.length)continue;
        var gOpen=dayExpand[gKey];
        var gTot=totals(gItems);
        var gSign=gKey==="expense"?"-":"+";
        html+='<div class="pl-group'+(gOpen?" is-open":"")+'" data-group="'+gKey+'">'
          +'<button class="pl-group-head" type="button" data-toggle="'+gKey+'">'
          +'<span class="pl-group-arrow">'+(gOpen?"▼":"▶")+'</span>'
          +'<span class="pl-group-label '+gCls+'">'+gLabel+'</span>'
          +'<span class="pl-group-meta pl-num">'+gItems.length+'笔 · '+gSign+fmt(gTot.income+gTot.expense)+'</span>'
          +'</button><div class="pl-group-body">';
        gItems.forEach(function(e){
          html+='<div class="pl-entry pl-entry-'+e.type+'"><div class="pl-entry-sign pl-num '+(e.type==="income"?"pl-pos":"pl-neg")+'">'+(e.type==="income"?"+":"-")+fmt(e.amount)+'</div>';
          html+='<div class="pl-entry-main"><div class="pl-entry-title">'+esc(e.category)+' · '+esc(e.detail)+'</div></div>';
          html+='<button class="pl-del" data-idx="'+ENTRIES.indexOf(e)+'" aria-label="删除">×</button></div>';
        });
        html+='</div></div>';
      }
    }
    html+='</div></div>';

    // 快速记账表单（演示）：分类/明细为组合框，点击弹下拉、可点选也可直接输入
    html+='<div class="pl-form-wrap"><div class="pl-form-caption">快速记账</div><div class="pl-form">';
    html+='<div class="pl-row"><div class="pl-seg"><button class="pl-seg-btn is-on" data-type="expense">支出</button><button class="pl-seg-btn" data-type="income">收入</button></div>'
      +'<div class="pl-cb"><input class="pl-input" placeholder="分类" data-combo="cat"><div class="pl-cb-panel"></div></div>'
      +'<div class="pl-cb"><input class="pl-input" placeholder="明细" data-combo="detail"><div class="pl-cb-panel"></div></div></div>';
    html+='<div class="pl-row"><input class="pl-input pl-amount" placeholder="金额" type="number" min="0" step="0.01"><div class="pl-chips">'+PRESETS.amounts.map(function(v){return '<button class="pl-chip" data-amt="'+v+'">'+v+'</button>';}).join('')+'</div></div>';
    html+='<div class="pl-row"><input class="pl-input pl-note" placeholder="描述（可选）"></div>';
    html+='<div class="pl-row pl-save-row"><button class="pl-btn pl-btn-primary" id="demoSave">记一笔</button></div>';
    html+='</div></div>';

    app.innerHTML=html;
    bind();
  }
  function stat(label,val,cls){
    return '<div class="pl-stat '+cls+'"><div class="pl-stat-label">'+label+'</div><div class="pl-stat-value pl-num">'+fmt(val)+'</div></div>';
  }
  function bind(){
        var days=app.querySelectorAll(".pl-day[data-date]");
    for(var i=0;i<days.length;i++)days[i].addEventListener("click",function(){selected=this.getAttribute("data-date");render();});
        var navs=app.querySelectorAll("[data-nav]");
    for(i=0;i<navs.length;i++)navs[i].addEventListener("click",function(){
      var k=this.getAttribute("data-nav");
      if(k==="prev"){M--;if(M<0){M=11;Y--;}}
      else if(k==="next"){M++;if(M>11){M=0;Y++;}}
      else {var t=new Date();Y=t.getFullYear();M=t.getMonth();selected=Y+"-"+pad(M+1)+"-"+pad(t.getDate());}
      render();
    });
        var chips=app.querySelectorAll(".pl-chip");
    for(i=0;i<chips.length;i++)chips[i].addEventListener("click",function(){var a=app.querySelector(".pl-amount");a.value=this.getAttribute("data-amt");});
    
    // 组合框：点击弹出预设下拉，可点选也可输入
    var curType="expense";
    var combos={};
    function fillCombo(cb){
      var input=cb.querySelector("input"),panel=cb.querySelector(".pl-cb-panel");
      var opts=cb.querySelector("input").getAttribute("data-combo")==="cat"
        ? (curType==="expense"?PRESETS.expenseCategories:PRESETS.incomeCategories)
        : PRESETS.details;
      var q=input.value.trim().toLowerCase();
      panel.innerHTML="";
      var n=0;
      opts.forEach(function(o){
        if(q&&o.toLowerCase().indexOf(q)<0)return;
        var it=document.createElement("button");
        it.type="button";it.className="pl-cb-item";it.textContent=o;
        it.addEventListener("click",function(){input.value=o;panel.classList.remove("is-open");});
        panel.appendChild(it);n++;
      });
      if(!n){var e=document.createElement("div");e.className="pl-cb-empty";e.textContent="没有匹配项，可直接输入新内容";panel.appendChild(e);}
    }
    app.querySelectorAll(".pl-cb").forEach(function(cb){
      var input=cb.querySelector("input"),panel=cb.querySelector(".pl-cb-panel");
      input.addEventListener("click",function(){fillCombo(cb);panel.classList.add("is-open");});
      input.addEventListener("focus",function(){fillCombo(cb);panel.classList.add("is-open");});
      input.addEventListener("input",function(){fillCombo(cb);});
      cb.addEventListener("mousedown",function(e){e.stopPropagation();});
    });
    document.addEventListener("mousedown",function(e){
      app.querySelectorAll(".pl-cb-panel").forEach(function(p){if(!p.parentElement.contains(e.target))p.classList.remove("is-open");});
    });

    var segs=app.querySelectorAll(".pl-seg-btn");
    for(i=0;i<segs.length;i++)segs[i].addEventListener("click",function(){
      segs.forEach(function(s){s.classList.remove("is-on");});
      this.classList.add("is-on");
      curType=this.getAttribute("data-type")||"expense";
    });
    // 分组折叠：点击「支出/收入」标题展开或折叠
    var toggles=app.querySelectorAll(".pl-group-head");
    for(i=0;i<toggles.length;i++)toggles[i].addEventListener("click",function(){
      var key=this.getAttribute("data-toggle");
      dayExpand[key]=!dayExpand[key];
      render();
    });
    // 删除二次确认：点 × 弹出像素风确认层（与插件内 Obsidian 确认弹窗一致），确认后才移除该条
    var dels=app.querySelectorAll(".pl-del");
    for(i=0;i<dels.length;i++)dels[i].addEventListener("click",function(){
            var idx=parseInt(this.getAttribute("data-idx"),10);
      var row=this.closest(".pl-entry");
      var title=row?row.querySelector(".pl-entry-title").textContent:"未分类";
      var sign=row?row.querySelector(".pl-entry-sign").textContent:"";
      var date=row?selected:"";
      var mask=document.createElement("div");mask.className="pl-demo-mask";
      mask.innerHTML='<div class="pl-demo-dialog"><div class="pl-modal-title">删除这条记录？</div>'
        +'<div class="pl-del-preview"><div class="pl-del-sign pl-num">'+sign+'</div>'
        +'<div class="pl-del-info"><div class="pl-del-title">'+esc(title)+'</div><div class="pl-del-date">日期：'+date+'</div></div></div>'
        +'<div class="pl-del-tip">删除后不可恢复。</div>'
        +'<div class="pl-del-btns"><button class="pl-btn" id="dlgCancel">取消</button><button class="pl-btn pl-btn-danger" id="dlgOk">确认删除</button></div></div>';
      document.body.appendChild(mask);
      mask.querySelector("#dlgCancel").addEventListener("click",function(){mask.remove();});
      mask.querySelector("#dlgOk").addEventListener("click",function(){
        if(idx>=0&&idx<ENTRIES.length)ENTRIES.splice(idx,1);
        mask.remove();render();
      });
    });
    var save=document.getElementById("demoSave");
    if(save)save.addEventListener("click",function(){alert("演示环境：数据不会保存。安装插件后即可真实记账。");});
  }
  render();
})();
</script>
</body>
</html>
